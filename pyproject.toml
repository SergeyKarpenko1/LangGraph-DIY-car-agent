[project]
name = "deteiling-agent"
version = "0.1.0"
description =""" Deteiling Agent is an AI assistant for DIY deteiling and car care. 
The project is based on a combination of LangChain + LangGraph 
and uses hybrid knowledge extraction from its own vector database and web search.
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.4",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "isort>=6.1.0",
    "langchain>=0.3.27",
    "langchain-chroma>=0.2.6",
    "langchain-community>=0.3.31",
    "langchain-core>=0.3.79",
    "langchain-huggingface>=0.3.1",
    "langchain-tavily>=0.2.12",
    "langgraph>=0.6.10",
    "langgraph-cli[inmem]>=0.4.8",
    "markdown>=3.9",
    "matplotlib>=3.10.7",
    "pip>=25.3",
    "ragas>=0.4.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.1.1",
    "spacy>=3.8.11",
    "streamlit>=1.40.0",
    "unstructured>=0.18.15",
    "requests>=2.32.0",
    "fastmcp>=2.14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]

[tool.isort]
profile = "black"

[tool.setuptools]
packages = ["lib"]
